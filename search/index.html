    <!-- 引入访问量计数器 -->
    
    <script>
        let HEXO_SETTINGS = {
            root: "/", 
            url: "https://nyaku.moe",
            author: "izNyaku"
        };

        let Nemophila = {
            version: "0.3.1"
        };

        let THEME_SETTINGS = {
            lazyload: {
                enable: true,
                loading_img: "/images/yachiyo_loading2_640.webp"
            },
            counter: {
                service: "nanocount",
                server: "https://nanocount-mine.nyaku.moe"
            }
        };

        const normalizeNanocountPath = (path) => {
            const normalized = path.replace(/\/+$/, '');
            return normalized || '/';
        };

        window.NEMOPHILA_COUNTER = {
            getPageViews: async (url) => {
                const counter = THEME_SETTINGS.counter;
                let endpoint;
                if (counter.service === 'nanocount') {
                    const target = new URL(url, window.location.href);
                    const query = new URLSearchParams({
                        host: target.hostname,
                        path: normalizeNanocountPath(target.pathname)
                    });
                    endpoint = counter.server + '/api/v1/count?' + query;
                } else {
                    endpoint = 'https://events.vercount.one/api/v2/log?url=' + encodeURIComponent(url);
                }
                const response = await fetch(endpoint);
                if (!response.ok) throw new Error('Counter request failed');
                const payload = await response.json();
                const data = payload && payload.data;
                const views = counter.service === 'nanocount' ? data && data.pageViews : data && data.page_pv;
                if (views === undefined || views === null) throw new Error('Invalid counter response');
                return views;
            }
        };

        if (THEME_SETTINGS.counter.service === 'nanocount') {
            document.addEventListener('DOMContentLoaded', async () => {
                try {
                    const response = await fetch(THEME_SETTINGS.counter.server + '/api/v1/hit', {
                        method: 'POST',
                        body: JSON.stringify({
                            host: window.location.hostname,
                            path: normalizeNanocountPath(window.location.pathname)
                        }),
                        credentials: 'omit',
                        mode: 'cors',
                        keepalive: true
                    });
                    if (!response.ok) throw new Error('Counter request failed');
                    const payload = await response.json();
                    const views = payload && payload.data && payload.data.pageViews;
                    if (views === undefined || views === null) throw new Error('Invalid counter response');
                    document.querySelectorAll('[data-nanocount-page]').forEach((node) => {
                        node.textContent = Number(views).toLocaleString();
                    });
                } catch (error) {
                    console.error('Error updating view count:', error);
                }
            });
        }
    </script>

<!-- 获取文章阅读量 -->
<script>
    const getUrl = (rawurl) => {
        if (rawurl.startsWith('http://') || rawurl.startsWith('https://')) {
            return rawurl;
        } else {
            if (rawurl.startsWith('/')) {
                return window.origin + rawurl;
            } else {
                return window.origin + '/' + rawurl;
            }
        }
    }

    // fetch 函数
    const fetchViewCounts = () => {
        const viewCountElements = document.querySelectorAll('.view-count');
        viewCountElements.forEach(element => {
            const postPath = element.getAttribute('data-path');
            const url = getUrl(postPath);
            window.NEMOPHILA_COUNTER.getPageViews(url)
                .then(readTime => {
                    element.textContent = readTime;
                })
                .catch(error => {
                    console.error('Error fetching view count:', error);
                    element.textContent = '一些';
                });
        });
    }

    document.addEventListener('DOMContentLoaded', fetchViewCounts);

</script>
